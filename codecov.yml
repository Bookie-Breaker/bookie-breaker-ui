coverage:
  round: down
  precision: 2
  status:
    project:
      default:
        target: 85%
        threshold: 0.5%
    patch:
      default:
        target: 85%
        threshold: 5%

ignore:
  - src/lib/api/gen
  - tests
  - scripts
  - src/instrumentation.server.ts

comment:
  layout: "condensed_header, diff, files"
  behavior: default
  require_changes: true
